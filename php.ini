; Picked up by DigitalOcean App Platform's Heroku-style PHP buildpack
; (heroku/php), which is what actually builds and runs this app in
; production — NOT docker/php.ini, despite this repo having a Dockerfile.
; The build logs show "No Procfile, using 'web: heroku-php-apache2'" and
; buildpack layers (heroku/php, heroku/nodejs), meaning App Platform is
; auto-detecting a PHP app and using Cloud Native Buildpacks instead of the
; Dockerfile. See https://devcenter.heroku.com/articles/php-support for
; this file's convention. Keep in sync with docker/php.ini.
;
; Matches UploadTrackRequest's audio (200MB — long-form sermons/podcasts can
; run past an hour) and cover-image (4MB) limits, with headroom for
; multipart form overhead.
upload_max_filesize = 210M
post_max_size = 220M
memory_limit = 256M
max_execution_time = 600
max_input_time = 600
