server {
    # App Platform routes HTTP traffic to whatever port the app declares
    # (HTTP_PORT env var, defaulting to 8080) — see DEPLOYMENT.md.
    listen 8080;
    server_name _;
    root /var/www/html/public;
    index index.php;

    # Matches UploadTrackRequest's 200MB audio-file limit (long-form sermons/
    # podcasts can easily run past an hour), see docker/php.ini.
    client_max_body_size 220M;

    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
        # A 200MB upload over a slow admin/creator connection can take a
        # while to finish streaming to php-fpm; matches php.ini's
        # max_execution_time/max_input_time.
        fastcgi_read_timeout 600;
    }

    location ~ /\.(?!well-known) {
        deny all;
    }

    access_log /dev/stdout;
    error_log /dev/stderr;
}
