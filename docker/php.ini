; Matches UploadTrackRequest's audio (200MB — long-form sermons/podcasts can
; run past an hour) and cover-image (4MB) limits, with headroom for
; multipart form overhead.
upload_max_filesize = 210M
post_max_size = 220M
memory_limit = 256M
max_execution_time = 600
max_input_time = 600

; Explicit rather than relying on the base image's default — rules out file
; uploads being disabled entirely, and pins the temp dir PHP buffers
; multipart uploads to before Laravel sees them to a path this container
; guarantees exists and is writable by www-data (see Dockerfile).
file_uploads = On
upload_tmp_dir = /tmp/php-uploads
